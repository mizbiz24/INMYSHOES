<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POTG Tracker — OW2</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ow-orange: #f99e1a;
    --ow-blue: #4fc3f7;
    --ow-dark: #0a0d14;
    --ow-panel: #111624;
    --ow-card: #161c2e;
    --ow-border: #1e2d4a;
    --ow-text: #cdd6f4;
    --ow-muted: #6b7db3;
    --tank-color: #4fc3f7;
    --dps-color: #ef5350;
    --support-color: #66bb6a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--ow-dark); color:var(--ow-text);
    font-family:'Barlow',sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(79,195,247,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(79,195,247,0.03) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none; z-index:0;
  }

  /* LOADING */
  #loadingOverlay {
    position:fixed; inset:0; background:var(--ow-dark);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:999; gap:16px; transition:opacity 0.3s;
  }
  #loadingOverlay.hidden { opacity:0; pointer-events:none; }
  .spinner {
    width:40px; height:40px;
    border:3px solid var(--ow-border);
    border-top-color:var(--ow-orange);
    border-radius:50%; animation:spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text {
    font-family:'Barlow Condensed',sans-serif;
    font-size:14px; letter-spacing:3px;
    text-transform:uppercase; color:var(--ow-muted);
  }

  /* HEADER */
  .header {
    position:relative; text-align:center;
    padding:48px 24px 32px; z-index:1;
  }
  .header::after {
    content:''; display:block; width:200px; height:2px;
    background:linear-gradient(90deg,transparent,var(--ow-orange),transparent);
    margin:16px auto 0;
  }
  .header-label {
    font-family:'Barlow Condensed',sans-serif;
    font-size:11px; letter-spacing:4px;
    text-transform:uppercase; color:var(--ow-orange); margin-bottom:8px;
  }
  .header h1 {
    font-family:'Barlow Condensed',sans-serif;
    font-size:clamp(36px,6vw,64px); font-weight:800;
    text-transform:uppercase; letter-spacing:2px; line-height:1; color:#fff;
  }
  .header h1 span { color:var(--ow-orange); }

  /* PLAYERS GRID */
  .players-grid {
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:16px; padding:0 24px 40px;
    position:relative; z-index:1;
  }
  .player-card {
    background:var(--ow-panel); border:1px solid var(--ow-border);
    border-radius:12px; width:180px; padding:20px 16px;
    cursor:pointer; transition:all 0.2s ease;
    position:relative; overflow:hidden;
  }
  .player-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,var(--ow-blue),var(--ow-orange));
    opacity:0; transition:opacity 0.2s;
  }
  .player-card:hover { border-color:var(--ow-blue); transform:translateY(-4px); box-shadow:0 8px 32px rgba(79,195,247,0.15); }
  .player-card:hover::before { opacity:1; }
  .player-avatar {
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,var(--ow-blue),var(--ow-orange));
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:22px; font-weight:800; color:#000;
    margin:0 auto 12px; text-transform:uppercase;
  }
  .player-name {
    font-family:'Barlow Condensed',sans-serif;
    font-size:18px; font-weight:700; text-align:center;
    text-transform:uppercase; letter-spacing:1px; color:#fff; margin-bottom:12px;
  }
  .progress-bar-bg { height:6px; background:var(--ow-border); border-radius:3px; overflow:hidden; margin-bottom:6px; }
  .progress-bar-fill {
    height:100%; background:linear-gradient(90deg,var(--ow-blue),var(--ow-orange));
    border-radius:3px; transition:width 0.4s ease;
  }
  .progress-text {
    text-align:center; font-family:'Barlow Condensed',sans-serif;
    font-size:13px; color:var(--ow-muted); letter-spacing:1px;
  }
  .progress-text strong { color:var(--ow-orange); font-size:15px; }

  /* PLAYER VIEW */
  .player-view {
    display:none; position:relative; z-index:1;
    padding:0 24px 60px; max-width:1100px; margin:0 auto;
    animation:fadeIn 0.3s ease;
  }
  .player-view.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .back-btn {
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--ow-border); color:var(--ow-muted);
    font-family:'Barlow Condensed',sans-serif; font-size:14px;
    letter-spacing:1px; text-transform:uppercase;
    padding:8px 16px; border-radius:6px; cursor:pointer;
    margin-bottom:24px; transition:all 0.2s;
  }
  .back-btn:hover { border-color:var(--ow-blue); color:var(--ow-blue); }
  .player-header {
    display:flex; align-items:center; gap:20px;
    margin-bottom:32px; padding-bottom:20px;
    border-bottom:1px solid var(--ow-border);
  }
  .player-header-avatar {
    width:72px; height:72px; border-radius:50%;
    background:linear-gradient(135deg,var(--ow-blue),var(--ow-orange));
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:28px; font-weight:800; color:#000; flex-shrink:0;
  }
  .player-header-info h2 {
    font-family:'Barlow Condensed',sans-serif;
    font-size:32px; font-weight:800;
    text-transform:uppercase; letter-spacing:2px; color:#fff;
  }
  .player-header-progress {
    font-family:'Barlow Condensed',sans-serif;
    font-size:14px; color:var(--ow-muted); letter-spacing:1px; margin-top:4px;
  }
  .player-header-progress strong { color:var(--ow-orange); font-size:18px; }

  /* ROLE SECTIONS */
  .role-section { margin-bottom:40px; }
  .role-title { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .role-icon {
    width:36px; height:36px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .role-icon.tank    { background:rgba(79,195,247,0.15); color:var(--tank-color); }
  .role-icon.dps     { background:rgba(239,83,80,0.15);  color:var(--dps-color); }
  .role-icon.support { background:rgba(102,187,106,0.15);color:var(--support-color); }
  .role-label {
    font-family:'Barlow Condensed',sans-serif;
    font-size:22px; font-weight:700;
    text-transform:uppercase; letter-spacing:2px;
  }
  .role-label.tank    { color:var(--tank-color); }
  .role-label.dps     { color:var(--dps-color); }
  .role-label.support { color:var(--support-color); }
  .role-count { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--ow-muted); letter-spacing:1px; margin-left:auto; }

  /* HERO GRID */
  .hero-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; }
  .hero-slot {
    background:var(--ow-card); border:1px solid var(--ow-border);
    border-radius:10px; overflow:hidden; cursor:pointer;
    transition:all 0.2s; position:relative;
  }
  .hero-slot:hover { border-color:var(--ow-blue); transform:translateY(-2px); box-shadow:0 4px 16px rgba(79,195,247,0.1); }
  .hero-slot.done { border-color:var(--ow-orange); box-shadow:0 0 12px rgba(249,158,26,0.2); }
  .hero-thumb { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .hero-thumb-placeholder {
    width:100%; aspect-ratio:16/9; background:var(--ow-border);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; color:var(--ow-muted);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800; text-transform:uppercase; letter-spacing:-1px;
  }
  .hero-name {
    padding:5px 6px; font-family:'Barlow Condensed',sans-serif;
    font-size:11px; font-weight:600; text-align:center;
    text-transform:uppercase; letter-spacing:0.5px; color:var(--ow-text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hero-done-badge {
    position:absolute; top:4px; right:4px;
    width:18px; height:18px; background:var(--ow-orange);
    border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:10px; color:#000; font-weight:700;
  }

  /* MODAL */
  .modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.85); backdrop-filter:blur(4px);
    z-index:100; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.active { display:flex; }
  .modal {
    background:var(--ow-panel); border:1px solid var(--ow-border);
    border-radius:16px; width:100%; max-width:460px; padding:28px;
    position:relative; animation:modalIn 0.25s ease;
  }
  @keyframes modalIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
  .modal-close {
    position:absolute; top:16px; right:16px;
    background:none; border:none; color:var(--ow-muted);
    font-size:20px; cursor:pointer; transition:color 0.2s;
  }
  .modal-close:hover { color:#fff; }
  .modal-hero-name {
    font-family:'Barlow Condensed',sans-serif;
    font-size:28px; font-weight:800;
    text-transform:uppercase; letter-spacing:2px; color:#fff; margin-bottom:4px;
  }
  .modal-player-name {
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px; color:var(--ow-muted);
    letter-spacing:1px; text-transform:uppercase; margin-bottom:20px;
  }
  .modal-preview {
    width:100%; aspect-ratio:16/9; background:var(--ow-border);
    border-radius:10px; overflow:hidden; margin-bottom:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-preview img { width:100%; height:100%; object-fit:cover; }
  .modal-preview-empty { text-align:center; color:var(--ow-muted); }
  .modal-preview-empty .icon { font-size:36px; display:block; margin-bottom:8px; }
  .modal-preview-empty p {
    font-size:13px; font-family:'Barlow Condensed',sans-serif;
    letter-spacing:1px; text-transform:uppercase;
  }
  .modal-actions { display:flex; gap:10px; }
  .btn {
    flex:1; padding:10px 16px; border-radius:8px;
    font-family:'Barlow Condensed',sans-serif; font-size:14px;
    font-weight:700; text-transform:uppercase; letter-spacing:1px;
    cursor:pointer; border:none; transition:all 0.2s;
  }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-upload { background:var(--ow-orange); color:#000; }
  .btn-upload:hover:not(:disabled) { background:#ffb347; }
  .btn-remove { background:rgba(239,83,80,0.15); border:1px solid rgba(239,83,80,0.3); color:#ef5350; }
  .btn-remove:hover:not(:disabled) { background:rgba(239,83,80,0.25); }
  .file-input { display:none; }

  /* TOAST */
  .save-toast {
    position:fixed; bottom:24px; right:24px;
    background:var(--ow-panel); border:1px solid var(--ow-border);
    border-radius:10px; padding:12px 20px;
    font-family:'Barlow Condensed',sans-serif; font-size:14px;
    letter-spacing:1px; text-transform:uppercase; color:var(--ow-text);
    z-index:200; transform:translateY(80px); opacity:0;
    transition:all 0.3s ease;
  }
  .save-toast.show { transform:translateY(0); opacity:1; }
  .save-toast.success { border-color:var(--ow-orange); color:var(--ow-orange); }
  .save-toast.error   { border-color:#ef5350; color:#ef5350; }

  @media (max-width:600px) {
    .hero-grid { grid-template-columns:repeat(auto-fill,minmax(85px,1fr)); }
    .players-grid { gap:12px; }
    .player-card { width:150px; }
  }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Loading tracker...</div>
</div>

<div id="homePage" style="display:none">
  <div class="header">
    <div class="header-label">Overwatch 2 · Play of the Game</div>
    <h1>POTG <span>Tracker</span></h1>
  </div>
  <div class="players-grid" id="playersGrid"></div>
</div>

<div class="player-view" id="playerView">
  <button class="back-btn" onclick="goHome()">← Back</button>
  <div class="player-header">
    <div class="player-header-avatar" id="pvAvatar"></div>
    <div class="player-header-info">
      <h2 id="pvName"></h2>
      <div class="player-header-progress">
        <strong id="pvCount">0</strong> / 51 POTG Collected
      </div>
    </div>
  </div>
  <div id="rolesections"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-hero-name" id="modalHeroName"></div>
    <div class="modal-player-name" id="modalPlayerName"></div>
    <div class="modal-preview" id="modalPreview">
      <div class="modal-preview-empty">
        <span class="icon">🎮</span>
        <p>No POTG yet</p>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-upload" id="uploadBtn" onclick="triggerUpload()">📸 Upload POTG</button>
      <button class="btn btn-remove" id="removeBtn" onclick="removePOTG()" style="display:none">🗑 Remove</button>
    </div>
    <input type="file" class="file-input" id="fileInput" accept="image/*" onchange="handleUpload(event)">
  </div>
</div>

<div class="save-toast" id="toast"></div>

<script>
const PLAYERS = ['Zoeyfuna','Mizbiz','Luwec','Etchokoy','Yunisu'];
const HEROES = {
  TANK:    ['Mauga','Orisa','Roadhog','Zarya','D.Va','Doomfist','Hazard','Winston','Wrecking Ball','Domina','Junker Queen','Ramattra','Reinhardt','Sigma'],
  DPS:     ['Anran','Genji','Reaper','Tracer','Vendetta','Venture','Echo','Freja','Pharah','Sierra','Sombra','Ashe','Cassidy','Hanzo','Sojourn','Widowmaker','Bastion','Emre','Junkrat','Mei','Soldier: 76','Symmetra','Torbjörn'],
  SUPPORT: ['Kiriko','Lifeweather','Mercy','Moira','Brigitte','Illari','Juno','Mizuki','Wuyang','Ana','Baptiste','Jetpack Cat','Lúcio','Zenyatta']
};
const ROLE_META = {
  TANK:    { label:'Tank',   icon:'🛡️', cls:'tank' },
  DPS:     { label:'Damage', icon:'⚔️', cls:'dps' },
  SUPPORT: { label:'Support',icon:'💚', cls:'support' }
};

const STORAGE_URL = 'https://api.anthropic.com/v1/artifacts/storage';

// db = { playerName: { heroName: base64, ... }, ... }
let db = {};
let currentPlayer = null, currentHero = null, isSaving = false;

// ===== STORAGE: 1 key per player =====
function playerKey(player) {
  return 'potg_ow2_' + player.toLowerCase().replace(/[^a-z0-9]/g,'_');
}

async function loadPlayer(player) {
  try {
    const res = await fetch(`${STORAGE_URL}?key=${playerKey(player)}&shared=true`);
    if (res.ok) {
      const data = await res.json();
      db[player] = data.value ? JSON.parse(data.value) : {};
    } else {
      db[player] = {};
    }
  } catch { db[player] = {}; }
}

async function savePlayer(player) {
  const res = await fetch(STORAGE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: playerKey(player), value: JSON.stringify(db[player]), shared: true })
  });
  if (!res.ok) throw new Error('Save failed');
}

function getImage(player, hero) { return (db[player] || {})[hero] || null; }
function getPlayerCount(p) { return Object.values(HEROES).flat().filter(h => getImage(p, h)).length; }

// ===== COMPRESS: 320px wide, 50% quality = ~10-20KB per image =====
function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const TARGET_W = 320;
        let w = img.width, h = img.height;
        // keep 16:9 crop from center
        const srcRatio = w / h;
        const targetRatio = 16 / 9;
        let sx=0, sy=0, sw=w, sh=h;
        if (srcRatio > targetRatio) {
          sw = Math.round(h * targetRatio);
          sx = Math.round((w - sw) / 2);
        } else {
          sh = Math.round(w / targetRatio);
          sy = Math.round((h - sh) / 2);
        }
        canvas.width = TARGET_W;
        canvas.height = Math.round(TARGET_W / targetRatio);
        canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.50));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ===== TOAST =====
let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `save-toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className='save-toast', 2500);
}

// ===== HOME =====
function renderHome() {
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = '';
  PLAYERS.forEach(p => {
    const count = getPlayerCount(p);
    const pct = (count/51)*100;
    const div = document.createElement('div');
    div.className = 'player-card';
    div.onclick = () => openPlayer(p);
    div.innerHTML = `
      <div class="player-avatar">${p[0]}</div>
      <div class="player-name">${p}</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-text"><strong>${count}</strong> / 51</div>
    `;
    grid.appendChild(div);
  });
}

// ===== PLAYER VIEW =====
function openPlayer(p) {
  currentPlayer = p;
  document.getElementById('homePage').style.display = 'none';
  document.getElementById('playerView').classList.add('active');
  document.getElementById('pvAvatar').textContent = p[0];
  document.getElementById('pvName').textContent = p;
  updateCount(); renderRoles();
}
function updateCount() { document.getElementById('pvCount').textContent = getPlayerCount(currentPlayer); }
function renderRoles() {
  const c = document.getElementById('rolesections');
  c.innerHTML = '';
  Object.entries(HEROES).forEach(([role, heroes]) => {
    const meta = ROLE_META[role];
    const done = heroes.filter(h => getImage(currentPlayer, h)).length;
    const sec = document.createElement('div');
    sec.className = 'role-section';
    sec.innerHTML = `
      <div class="role-title">
        <div class="role-icon ${meta.cls}">${meta.icon}</div>
        <span class="role-label ${meta.cls}">${meta.label}</span>
        <span class="role-count">${done}/${heroes.length}</span>
      </div>
      <div class="hero-grid" id="g-${role}"></div>
    `;
    c.appendChild(sec);
    const grid = sec.querySelector(`#g-${role}`);
    heroes.forEach(hero => {
      const img = getImage(currentPlayer, hero);
      const slot = document.createElement('div');
      slot.className = `hero-slot${img?' done':''}`;
      slot.onclick = () => openModal(hero);
      slot.innerHTML = img
        ? `<img class="hero-thumb" src="${img}"><div class="hero-done-badge">✓</div><div class="hero-name">${hero}</div>`
        : `<div class="hero-thumb-placeholder">${hero.slice(0,2)}</div><div class="hero-name">${hero}</div>`;
      grid.appendChild(slot);
    });
  });
}
function goHome() {
  currentPlayer = null;
  document.getElementById('homePage').style.display = 'block';
  document.getElementById('playerView').classList.remove('active');
  renderHome();
}

// ===== MODAL =====
function openModal(hero) {
  currentHero = hero;
  document.getElementById('modalHeroName').textContent = hero;
  document.getElementById('modalPlayerName').textContent = currentPlayer;
  refreshPreview();
  document.getElementById('modalOverlay').classList.add('active');
}
function refreshPreview() {
  const img = getImage(currentPlayer, currentHero);
  document.getElementById('modalPreview').innerHTML = img
    ? `<img src="${img}">`
    : `<div class="modal-preview-empty"><span class="icon">🎮</span><p>No POTG yet</p></div>`;
  document.getElementById('removeBtn').style.display = img ? 'flex' : 'none';
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  if (isSaving) return;
  document.getElementById('modalOverlay').classList.remove('active');
  currentHero = null;
}
function triggerUpload() { document.getElementById('fileInput').value=''; document.getElementById('fileInput').click(); }
function setBtns(d) { document.getElementById('uploadBtn').disabled=d; document.getElementById('removeBtn').disabled=d; }

async function handleUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  isSaving=true; setBtns(true); showToast('⏳ Compressing...');
  try {
    const compressed = await compressImage(file);
    showToast('⏳ Saving...');
    if (!db[currentPlayer]) db[currentPlayer] = {};
    db[currentPlayer][currentHero] = compressed;
    await savePlayer(currentPlayer);
    refreshPreview(); renderRoles(); updateCount();
    showToast('✓ Saved!','success');
  } catch(err) {
    if (db[currentPlayer]) delete db[currentPlayer][currentHero];
    showToast('✗ Save failed','error');
  } finally { isSaving=false; setBtns(false); }
}

async function removePOTG() {
  if (!confirm(`Remove POTG for ${currentHero}?`)) return;
  const backup = getImage(currentPlayer, currentHero);
  isSaving=true; setBtns(true); showToast('⏳ Removing...');
  delete db[currentPlayer][currentHero];
  try {
    await savePlayer(currentPlayer);
    refreshPreview(); renderRoles(); updateCount();
    showToast('✓ Removed','success');
  } catch {
    db[currentPlayer][currentHero] = backup;
    showToast('✗ Remove failed','error');
  } finally { isSaving=false; setBtns(false); }
}

// ===== INIT: load all 5 players in parallel (5 calls only) =====
(async () => {
  await Promise.all(PLAYERS.map(loadPlayer));
  document.getElementById('loadingOverlay').classList.add('hidden');
  document.getElementById('homePage').style.display = 'block';
  renderHome();
})();
</script>
